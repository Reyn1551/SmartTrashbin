<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>OPREC RDC · Controller</title>
<style>
  /* ============================================================
     OPREC RDC — handheld transmitter
     Base: warm neutral. ONE brand accent (amber).
     Only two function colours: drive blue, stop red.
     ============================================================ */
  :root {
    --bg:        #141311;
    --panel:     #1f1d1a;
    --panel-hi:  #2a2724;
    --line:      #383430;
    --text:      #f2efe9;
    --muted:     #8d867c;
    --brand:     #f0a020;
    --drive:     #3d7fb8;
    --drive-hi:  #4e94d0;
    --stop:      #c0392b;
    --stop-hi:   #d4503f;
    /* lids: shut = resting slate, open = active teal, so the operator
       reads at a glance which lid is standing open (and could hit
       something). Colour is never the only cue -- label flips too.  */
    --lid-shut:  #4a4642;
    --lid-open:  #2f8f6a;
    --r-md: 10px;
    --r-lg: 14px;
  }

  * {
    margin: 0; padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* ---------- portrait gate ---------- */
  #gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; padding: 32px;
    background: var(--bg); z-index: 900;
    text-align: center;
  }
  #gate h1 {
    font-size: 20px; font-weight: 650; letter-spacing: .1em;
    text-transform: uppercase; color: var(--brand);
  }
  #gate p { font-size: 15px; line-height: 1.6; color: var(--muted); max-width: 30ch; }
  #start {
    min-height: 52px; padding: 0 32px;
    font: inherit; font-size: 15px; font-weight: 650; letter-spacing: .08em;
    color: #1a1613; background: var(--brand);
    border: 0; border-radius: var(--r-md); cursor: pointer;
  }
  #start:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  /* ---------- shell ----------
     No header, no footer: the deck owns the whole screen. Status and
     fullscreen float on top so the controls keep every usable pixel. */
  #shell {
    display: none;
    position: relative;
    height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .link {
    position: absolute;
    top: calc(8px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; letter-spacing: .06em; color: var(--muted);
    pointer-events: none; z-index: 60;
    opacity: 0; transition: opacity 240ms;
  }
  .link.show { opacity: 1; }
  .link i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); font-style: normal;
  }
  .link.show i { background: var(--lid-open); box-shadow: 0 0 0 3px rgba(47,143,106,.18); }

  .ghost {
    position: absolute;
    top: calc(8px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    width: 36px; height: 36px;
    display: grid; place-items: center;
    color: var(--muted); background: transparent;
    border: 1px solid transparent; border-radius: var(--r-md);
    cursor: pointer; transition: color 140ms, border-color 140ms;
    z-index: 60;
  }
  .ghost:hover { color: var(--text); border-color: var(--line); }
  .ghost:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .ghost svg { width: 16px; height: 16px; }

  /* ---------- main layout ----------
     A control surface, not a document: the deck gets a hard height
     budget and the two wings are driven off --pad (one square size
     that both sides share), so they can never drift apart.        */
  .deck {
    --gap: 7px;
    /* overhead = deck padding + the pad label + its margin. No header
       and no footer any more, so the controls get the rest.          */
    --overhead: 96px;
    /* floor of 150px: a 3x3 grid of 44px targets + gaps needs it.
       Below that we would ship buttons nobody can reliably hit, so
       the floor wins and the deck scrolls instead. */
    --pad: max(150px, min(
             calc(100vh - var(--overhead)),
             calc((100vw - 380px) / 2),
             320px
           ));
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    justify-items: center;
    gap: 14px;
    padding: 12px 20px;
    overflow: auto;
    min-height: 0;
    overscroll-behavior: contain;
  }

  .wing {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
  }

  .pad-label {
    font-size: 10px; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }

  /* one square, shared by both wings */
  .drive,
  .lid-col {
    width: var(--pad);
    height: var(--pad);
    display: grid;
    gap: var(--gap);
  }

  .drive {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  /* ---------- shared button ---------- */
  .btn {
    border: 0; font: inherit; color: var(--text);
    cursor: pointer; border-radius: var(--r-md);
    display: grid; place-items: center;
    transition: background 130ms, transform 90ms, filter 130ms;
    position: relative;
  }
  .btn:active { transform: translateY(1px) scale(.975); }
  .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .btn .ico { font-size: 15px; line-height: 1; }

  /* ---------- drive pad ---------- */
  .drive .btn {
    background: var(--drive);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.22);
    min-width: 0; min-height: 0;
  }
  .drive .btn:hover { background: var(--drive-hi); }
  .drive .btn .ico { font-size: calc(var(--pad) / 9); }
  .drive .stop {
    background: var(--stop);
    /* colour must not be the only signal for STOP — give it a ring
       so it still reads as the safety control in grayscale. */
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.55),
                inset 0 -2px 0 rgba(0,0,0,.22);
  }
  .drive .stop:hover { background: var(--stop-hi); }
  .drive .stop .ico { font-size: calc(var(--pad) / 14); }

  /* grid placement */
  .g-u { grid-area: 1 / 2; } .g-l { grid-area: 2 / 1; }
  .g-s { grid-area: 2 / 2; } .g-r { grid-area: 2 / 3; }
  .g-d { grid-area: 3 / 2; }

  /* ---------- middle: speed ---------- */
  .speed {
    width: 168px;
    padding: 16px 16px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    text-align: center;
  }
  .speed .readout {
    font-size: 34px; font-weight: 300; line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em; color: var(--text);
  }
  .speed .unit {
    font-size: 10px; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted);
    margin: 3px 0 14px;
  }
  .speed .cap {
    font-size: 10px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 34px; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(
      to right, var(--brand) 0 var(--fill, 55%), var(--panel-hi) var(--fill, 55%) 100%);
  }
  input[type=range]::-moz-range-track {
    height: 6px; border-radius: 3px; background: var(--panel-hi);
  }
  input[type=range]::-moz-range-progress {
    height: 6px; border-radius: 3px; background: var(--brand);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; margin-top: -8px;
    border-radius: 50%; background: var(--text);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--line);
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--text); border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--line);
  }
  input[type=range]:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; border-radius: 4px; }

  /* ---------- lid stack ----------
     Two independent lids. They sit SIDE BY SIDE (kiri | kanan) so the
     layout mirrors the bin: left button = left lid, no mental flip.
     Calibration rides in its own row underneath.                   */
  .lid-col {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr auto;
  }

  .lid {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 5px;
    min-width: 0; min-height: 0; overflow: hidden;
    background: var(--lid-shut);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.22);
    transition: background 180ms;
  }
  .lid.open { background: var(--lid-open); }
  .lid:hover { filter: brightness(1.08); }
  .lid .state {
    font-size: calc(var(--pad) / 13);
    font-weight: 700; letter-spacing: .06em; line-height: 1;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.28);
  }
  .lid .sub {
    font-size: max(7px, calc(var(--pad) / 40));
    font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #fff; opacity: .88;
    text-align: center; line-height: 1.25;
    max-width: 100%; overflow: hidden;
  }
  .lid .ico {
    font-size: calc(var(--pad) / 13);
    line-height: 1; margin-bottom: 1px;
  }

  .calib {
    grid-column: 1 / -1;
    height: max(30px, calc(var(--pad) / 7));
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: max(9px, calc(var(--pad) / 26));
    font-weight: 650; letter-spacing: .1em;
    text-transform: uppercase;
    padding: 0 6px;
  }
  .calib:hover { color: var(--brand); border-color: var(--brand); }

  /* ---------- responsive ---------- */
  @media (orientation: landscape) {
    #gate { display: none; }
    #shell { display: grid; }
  }
  @media (orientation: landscape) and (max-height: 400px) {
    /* short screen: drop the pad label and tighten so the controls
       keep a 44px+ touch target instead of shrinking. */
    .ghost { width: 30px; height: 30px; top: 4px; right: 6px; }
    .ghost svg { width: 14px; height: 14px; }
    .deck { --gap: 5px; --overhead: 62px; padding: 6px 14px; gap: 10px; }
    .pad-label { display: none; }
    .speed { width: 128px; padding: 9px 10px 8px; }
    .speed .readout { font-size: 24px; }
    .speed .unit { margin: 2px 0 8px; }
    .speed .cap { margin-bottom: 4px; }
    .calib { height: 28px; font-size: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="gate">
  <h1>Rotate device</h1>
  <p>Putar perangkat ke posisi mendatar untuk membuka panel kendali.</p>
  <button id="start" onclick="goFullscreen()">BUKA PANEL</button>
</div>

<div id="shell">
  <div class="deck">

    <!-- DRIVE -->
    <section class="wing">
      <p class="pad-label">Gerak</p>
      <div class="drive">
        <button class="btn g-u" data-hold="F" aria-label="Maju"><span class="ico">&#9650;</span></button>
        <button class="btn g-l" data-hold="L" aria-label="Belok kiri"><span class="ico">&#9664;</span></button>
        <button class="btn stop g-s" data-tap="P" aria-label="Stop"><span class="ico">&#9632;</span></button>
        <button class="btn g-r" data-hold="R" aria-label="Belok kanan"><span class="ico">&#9654;</span></button>
        <button class="btn g-d" data-hold="B" aria-label="Mundur"><span class="ico">&#9660;</span></button>
      </div>
    </section>

    <!-- SPEED -->
    <section class="speed">
      <div class="readout" id="pwm-out">140</div>
      <div class="unit">PWM</div>
      <div class="cap">Kecepatan</div>
      <input type="range" min="0" max="255" value="140" id="pwm" aria-label="Kecepatan motor">
    </section>

    <!-- LIDS -->
    <section class="wing">
      <p class="pad-label">Tutup</p>
      <div class="lid-col">
        <button class="btn lid" id="lid-left" onclick="toggleLid('left')" aria-pressed="false">
          <span class="ico">&#9664;</span>
          <span class="sub">TONG KIRI</span>
          <span class="state" id="left-state">TUTUP</span>
        </button>
        <button class="btn lid" id="lid-right" onclick="toggleLid('right')" aria-pressed="false">
          <span class="ico">&#9654;</span>
          <span class="sub">TONG KANAN</span>
          <span class="state" id="right-state">TUTUP</span>
        </button>
        <button class="btn calib" onclick="send('A')">Kalibrasi</button>
      </div>
    </section>

  </div>

  <!-- status + fullscreen float over the deck: no header bar, but the
       feedback and the escape hatch stay reachable. -->
  <div class="link" id="link"><i></i><span id="link-txt"></span></div>
  <button class="ghost" onclick="toggleFullscreen()" aria-label="Layar penuh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
  </button>
</div>

<script>
  /* ---------- request layer ----------
     send() is the single seam: in the preview it only logs,
     on the ESP32 it fires the same XHR as before.            */
  function send(cmd) {
    log(cmd);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/cmd?val=' + cmd, true);
    xhr.send();
  }
  function sendSpeed(val) {
    log('V' + val);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/speed?val=' + val, true);
    xhr.send();
  }

  /* ---------- drive: press-and-hold so the robot cannot run away ---------- */
  var HELD = 'P';
  function begin(cmd) { HELD = cmd; send(cmd); }
  function release()  { if (HELD !== 'P') { HELD = 'P'; send('P'); } }

  document.querySelectorAll('[data-hold]').forEach(function (b) {
    var cmd = b.dataset.hold;
    // pointer events cover mouse + touch + stylus in one path
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); begin(cmd); });
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('pointerleave', function () { if (HELD === cmd) release(); });
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); begin(cmd); }
    });
    b.addEventListener('keyup', function (e) {
      if (e.key === 'Enter' || e.key === ' ') release();
    });
  });
  document.querySelectorAll('[data-tap]').forEach(function (b) {
    b.addEventListener('click', function () { send(b.dataset.tap); });
  });

  /* last-ditch safety: pointer lost mid-press must not leave motors running */
  window.addEventListener('blur', release);
  window.addEventListener('pointerup', release);

  /* ---------- speed ---------- */
  var slider = document.getElementById('pwm');
  var out    = document.getElementById('pwm-out');

  function onSlide(v) {
    out.textContent = v;
    slider.style.setProperty('--fill', (v / 255 * 100) + '%');
  }
  slider.addEventListener('input', function () { onSlide(slider.value); });
  slider.addEventListener('change', function () { sendSpeed(slider.value); });
  onSlide(slider.value);

  /* ---------- lids ----------
     Two independent lids. Each is its own toggle: press to open,
     press again to close, and the button says which state it is in.
     State is per-side so the operator can hold one open while
     working the other.                                            */
  var lids = { left: false, right: false };   /* false = tutup */

  /* Placeholder command codes. The real bin firmware does not exist
     yet -- these map 1:1 to Nano.ino's existing keys so nothing
     silently mismatches when it is wired up:
       openGripper = 'C'   closeGripper = 'S'
     When the bin firmware lands, change these two lines only.      */
  var LID_CMD = { open: 'C', close: 'S' };

  function paintLid(side) {
    var isOpen = lids[side];
    var el = document.getElementById('lid-' + side);
    el.classList.toggle('open', isOpen);
    el.setAttribute('aria-pressed', String(isOpen));
    document.getElementById(side + '-state').textContent = isOpen ? 'TERBUKA' : 'TUTUP';
  }

  function toggleLid(side) {
    lids[side] = !lids[side];
    send(lids[side] ? LID_CMD.open : LID_CMD.close);
    paintLid(side);
  }

  paintLid('left');
  paintLid('right');

  /* ---------- fullscreen ---------- */
  function goFullscreen() {
    var el = document.documentElement;
    var r  = el.requestFullscreen || el.webkitRequestFullscreen;
    if (r) { try { r.call(el); } catch (e) {} }
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function () {});
    }
  }
  function toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else { goFullscreen(); }
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  /* ---------- preview instrumentation (drop when flashing) ----------
     No footer any more, so feedback rides on the floating status line
     and fades out by itself -- it never competes with the controls.  */
  var logTimer = null;
  function log(cmd) {
    var l = document.getElementById('link');
    document.getElementById('link-txt').textContent =
      cmd === 'P' ? 'stop' : 'terkirim ' + cmd;
    l.classList.add('show');
    clearTimeout(logTimer);
    logTimer = setTimeout(function () { l.classList.remove('show'); }, 1400);
  }
</script>
</body>
</html>
